name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Version beginning with v
        required: true
        type: string

permissions:
  contents: read

jobs:
  native-smoke:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            suffix: ""
          - os: macos-latest
            suffix: ""
          - os: windows-latest
            suffix: .exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build and install client
        shell: bash
        run: |
          go build -trimpath -o "${RUNNER_TEMP}/bord${{ matrix.suffix }}" ./cmd/bord
          "${RUNNER_TEMP}/bord${{ matrix.suffix }}" --version

  package:
    needs: native-smoke
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Resolve release metadata
        id: metadata
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          version="${GITHUB_REF_NAME}"
          if [ "${GITHUB_EVENT_NAME}" = workflow_dispatch ]; then version="${INPUT_VERSION}"; fi
          if [[ ! "${version}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
             echo "version must be a safe semantic version beginning with v" >&2
             exit 2
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)" >> "${GITHUB_ENV}"
      - name: Gate known vulnerabilities
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          mkdir supply-chain-evidence
          govulncheck -json ./... > supply-chain-evidence/govulncheck.json
      - name: Gate dependency licenses
        run: |
          go install github.com/google/go-licenses@v1.6.0
          test "$(go list -m -f '{{.Version}}' modernc.org/mathutil)" = v1.7.1
          go-licenses check ./... --disallowed_types=forbidden,restricted --ignore modernc.org/mathutil
          go-licenses report ./... --ignore bord,modernc.org/mathutil > supply-chain-evidence/dependency-licenses.csv
          cat .github/license-policy/manual-review.csv >> supply-chain-evidence/dependency-licenses.csv
      - name: Generate source SBOM
        run: |
          go install github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@v1.9.0
          cyclonedx-gomod mod -json -output supply-chain-evidence/source-bom.cdx.json
      - name: Build deterministic archives
        run: python3 scripts/release.py --version "${{ steps.metadata.outputs.version }}"
      - name: Verify checksums and Linux installs
        shell: bash
        run: |
          (cd dist && sha256sum --check SHA256SUMS)
          mkdir smoke release-contents
          python3 scripts/validate-release.py --directory dist --version "${{ steps.metadata.outputs.version }}" --extract release-contents
          tar -xzf "dist/bord_${{ steps.metadata.outputs.version }}_linux_amd64.tar.gz" -C smoke
          tar -xzf "dist/bord-server_${{ steps.metadata.outputs.version }}_linux_amd64.tar.gz" -C smoke
          "smoke/bord_${{ steps.metadata.outputs.version }}_linux_amd64/bord" --version | grep -F "${{ steps.metadata.outputs.version }}"
          "smoke/bord-server_${{ steps.metadata.outputs.version }}_linux_amd64/bord-server" version | grep -F "${{ steps.metadata.outputs.version }}"
      - name: Generate release SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: release-contents
          format: cyclonedx-json
          output-file: supply-chain-evidence/release-bom.cdx.json
          syft-version: v1.54.1
          upload-artifact: false
          upload-release-assets: false
      - name: Scan release artifacts
        uses: anchore/scan-action@1638637db639e0ade3258b51db49a9a137574c3e # v6
        with:
          sbom: supply-chain-evidence/release-bom.cdx.json
          # Module-level findings still block release even when govulncheck
          # cannot reach the affected package from the application call graph.
          fail-build: true
          severity-cutoff: high
          output-format: json
          output-file: supply-chain-evidence/grype.json
          grype-version: v0.120.1
      - name: Validate and stage supply-chain evidence
        run: |
          python3 scripts/validate-supply-chain.py --directory supply-chain-evidence --release
          (cd supply-chain-evidence && sha256sum dependency-licenses.csv govulncheck.json grype.json release-bom.cdx.json source-bom.cdx.json > EVIDENCE_SHA256SUMS)
          cp supply-chain-evidence/* dist/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ steps.metadata.outputs.version }}
          path: dist/*
          if-no-files-found: error
      - name: Publish GitHub release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: dist/*
          fail_on_unmatched_files: true
