name: security

on:
  push:
  pull_request:
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read

jobs:
  dependency-security-license:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Known vulnerability scan
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          govulncheck -json ./... > govulncheck.json
      - name: License policy
        run: |
          go install github.com/google/go-licenses@v1.6.0
          test "$(go list -m -f '{{.Version}}' modernc.org/mathutil)" = v1.7.1
          go-licenses check ./... --disallowed_types=forbidden,restricted --ignore modernc.org/mathutil
          # The main module path is intentionally local ("bord") and has no
          # resolvable VCS URL; its own LICENSE is reviewed in this repository.
          go-licenses report ./... --ignore bord,modernc.org/mathutil > dependency-licenses.csv
          cat .github/license-policy/manual-review.csv >> dependency-licenses.csv
      - name: Generate source SBOM
        run: |
          go install github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@v1.9.0
          cyclonedx-gomod mod -json -output source-bom.cdx.json
          python3 scripts/validate-supply-chain.py --directory .
          sha256sum dependency-licenses.csv govulncheck.json source-bom.cdx.json > EVIDENCE_SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: security-evidence
          path: |
            dependency-licenses.csv
            EVIDENCE_SHA256SUMS
            govulncheck.json
            source-bom.cdx.json
          if-no-files-found: error
