name: terminal-smoke

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  terminal-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Run native and cross-built terminal smoke matrix
        shell: bash
        run: ./scripts/terminal-smoke.sh
