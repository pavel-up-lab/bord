name: terminal-smoke

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  terminal-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Run native and cross-built terminal smoke matrix
        shell: bash
        run: ./scripts/terminal-smoke.sh
